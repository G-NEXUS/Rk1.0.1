    <!-- Fixed pages. common.js copies one of these into the page when its link is opened. -->
    <template id="tpl-login">
        <section class="auth-stage"><div class="form-container auth-form">
            <button class="auth-close" type="button" aria-label="Close form" onclick="location.hash = '#/home'">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
            <h1 class="auth-title">Sign In</h1>
            <p id="login-subtitle" class="auth-subtitle">Sign in with your email and password to access your account.</p>
            <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
                <a href="#/login" class="auth-tab is-active" role="tab" aria-selected="true">Login</a>
                <a href="#/register" class="auth-tab" role="tab" aria-selected="false">Register</a>
            </div>
            <div id="login-google-wrap" class="auth-social-wrap" hidden>
                <button type="button" id="login-google-btn" class="auth-google-btn" onclick="triggerGoogleAuth('login')">
                    <svg class="auth-google-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1h-9.18v2.98h5.27c-.23 1.47-1.69 4.31-5.27 4.31-3.17 0-5.76-2.63-5.76-5.89s2.59-5.89 5.76-5.89c1.81 0 3.02.77 3.71 1.43l2.53-2.44C16.79 4.09 14.69 3.2 12.17 3.2 7.21 3.2 3.2 7.21 3.2 12.17s4.01 8.97 8.97 8.97c5.18 0 8.61-3.64 8.61-8.77 0-.59-.06-1.04-.14-1.27Z"/></svg>
                    <span>Sign in with Google</span>
                </button>
                <div class="auth-divider" aria-hidden="true"><span>OR WITH EMAIL</span></div>
            </div>
            <p id="login-notice" class="auth-notice text-center mb-20" role="status" hidden></p>
            <form class="auth-fields-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <div class="auth-label-row">
                        <label for="login-password">Password</label>
                        <a class="auth-forgot-link" href="#/forgot-password">Forgot password?</a>
                    </div>
                    <div class="password-field">
                        <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
                        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" onclick="togglePassword('login-password', this)">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.9-.5"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-full auth-submit-btn">Sign In with Email</button>
            </form>
            <p class="auth-footer">Looking to browse first? <a class="auth-footer-link" href="#/home">Return to Shop</a></p>
        </div></section>
    </template>

    <template id="tpl-register">

            <form class="auth-fields-form" onsubmit="handleRegister(event)">

                    <input type="text" id="reg-name" placeholder="e.g. Choolwe Chingobe" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="password-field">
                        <input type="password" id="reg-password" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
                        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" onclick="togglePassword('reg-password', this)">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.9-.5"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password</label>

                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.9-.5"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-full auth-submit-btn">Create Account</button>
            </form>
            <p class="auth-footer">Looking to browse first? <a class="auth-footer-link" href="#/home">Return to Shop</a></p>
        </div></section>

    <template id="tpl-about">
        <article class="content-page"><h1 class="section-title">About RK CONNEKT</h1>
            <p class="mb-20">RK CONNEKT is here to make shopping for dependable everyday essentials simple and straightforward.</p>
            <p class="mb-20">Our collection brings together useful products for home, work, and leisure, with a focus on quality, value, and friendly service.</p>
            <img class="content-image" src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=1000" alt="A bright, welcoming workspace"></article>
    </template>

    <template id="tpl-contact">
        <div class="form-container"><h1 class="section-title">Get in Touch</h1><p class="mb-20">Have a question? We're here to help.</p>
            <form onsubmit="sendContactMessage(event)">
                <div class="form-group"><label for="contact-name">Name</label><input id="contact-name" required></div>
                <div class="form-group"><label for="contact-email">Email</label><input type="email" id="contact-email" required></div>
                <div class="form-group"><label for="contact-subject">Subject</label><input id="contact-subject" required></div>
                <div class="form-group"><label for="contact-message">Message</label><textarea id="contact-message" rows="5" required></textarea></div>
                <button type="submit" class="btn btn-full">Send Message</button>
            </form></div>
    </template>

    <template id="tpl-faq">
        <article class="content-page"><h1 class="section-title">Frequently Asked Questions</h1>
            <section class="faq-item"><h2 class="faq-question">How long does shipping take?</h2><p>Domestic shipping typically takes 3-5 business days. International shipping can take 7-14 business days.</p></section>
            <section class="faq-item"><h2 class="faq-question">What is your return policy?</h2><p>We offer a 7-day return policy for all unused items in their original packaging.</p></section>
            <section class="faq-item"><h2 class="faq-question">Do you offer international shipping?</h2><p>Yes, we ship to over 50 countries worldwide. Shipping costs will be calculated at checkout.</p></section>
            <section class="faq-item"><h2 class="faq-question">How can I track my order?</h2><p>Once your order ships, you will receive an email with a tracking number and a link to track your package.</p></section>
        </article>
    </template>

    <template id="tpl-legal">
        <article class="content-page legal-page">
            <section id="privacy" class="mb-20"><h1 class="section-title">Privacy Policy</h1><p>Your privacy is important to us. We respect your privacy regarding information we may collect from you through our website.</p><p>We only ask for personal information when we need it to provide a service to you, and collect it by fair and lawful means, with your knowledge and consent.</p></section>
            <hr><section id="terms" class="mb-20"><h2 class="section-title">Terms of Service</h2><p>By accessing our website, you agree to be bound by these terms of service and all applicable laws and regulations.</p></section>
            <hr><section id="returns" class="mb-20"><h2 class="section-title">Returns Policy</h2><p>You have 30 calendar days to return an item from the date you received it. To be eligible, your item must be unused and in the same condition that you received it.</p></section>
        </article>
    </template>

    <!-- Admin: add / edit product popup -->
    <template id="tpl-product-modal">
        <div id="product-modal" class="modal" hidden onclick="if(event.target===this) closeProductModal()">
            <div class="form-container modal-content product-modal-content">
                <div class="product-modal-header">
                    <h2 id="product-modal-title">Add New Product</h2>
                    <button type="button" class="product-modal-close" aria-label="Close product form" onclick="closeProductModal()">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
                    </button>
                </div>
                <p id="product-form-notice" class="auth-notice product-form-notice" role="alert" hidden></p>
                <form id="product-form" class="product-form" onsubmit="saveNewProduct(event)">
                    <input id="p-id" type="hidden">
                    <div class="form-group">
                        <label for="p-name">Product Name</label>
                        <input id="p-name" placeholder="e.g. Arsenal Home Jersey" required>
                    </div>
                    <div class="product-form-row">
                        <div class="form-group">
                            <label for="p-price">Actual Price (K)</label>
                            <input id="p-price" type="number" min="0" step="0.01" placeholder="e.g. 350" required>
                        </div>
                        <div class="form-group">
                            <label for="p-promo-price">Promotion Amount (K) <small>(optional)</small></label>
                            <input id="p-promo-price" type="number" min="0" step="0.01" placeholder="e.g. 280">
                            <small class="form-hint">Must be lower than the actual price. Shown alongside the cancelled actual price.</small>
                        </div>
                    </div>
                    <div class="product-form-row">
                        <div class="form-group">
                            <label for="p-bulk-price">Bulk Price (K) <small>(optional)</small></label>
                            <input id="p-bulk-price" type="number" min="0" step="0.01" placeholder="e.g. 250">
                            <small class="form-hint">Lower price per item when buying in bulk.</small>
                        </div>
                        <div class="form-group">
                            <label for="p-bulk-qty">Bulk Min Quantity <small>(optional)</small></label>
                            <input id="p-bulk-qty" type="number" min="2" step="1" placeholder="e.g. 5">
                            <small class="form-hint">Applies when ordering this many or more.</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="p-image">Product Photos</label>
                        <input id="p-image" type="file" accept="image/*" multiple onchange="addProductPhotos(event)">
                        <small class="form-hint">Add up to 7 photos. Images are automatically resized for fast saving. The first photo is the main photo.</small>
                        <div id="product-photo-list" class="photo-list"></div>
                    </div>
                    <div class="product-form-row">
                        <div class="form-group">
                            <label for="p-category">Category</label>
                            <select id="p-category" onchange="syncProductSubcategoryOptions(); syncVariantFields()"></select>
                        </div>
                        <div class="form-group">
                            <label for="p-subcategory">Subcategory <small>(optional)</small></label>
                            <select id="p-subcategory">
                                <option value="">None (optional)</option>
                            </select>
                        </div>
                    </div>
                    <div class="product-form-row">
                        <div id="color-field" class="form-group">
                            <label for="p-colors">Colors <small>(optional)</small></label>
                            <input id="p-colors" placeholder="e.g. Black, White, Red">
                            <small class="form-hint">Separate colors with commas, or leave blank.</small>
                        </div>
                        <div id="size-field" class="form-group">
                            <label for="p-sizes">Sizes <small>(optional)</small></label>
                            <input id="p-sizes" placeholder="e.g. S, M, L, XL">
                            <small class="form-hint">Separate sizes with commas, or leave blank.</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="p-desc">Description <small>(optional)</small></label>
                        <textarea id="p-desc" rows="3" placeholder="Brief details about this product..."></textarea>
                    </div>
                    <div class="modal-actions product-modal-actions">
                        <button type="submit" class="btn" id="product-save-button">Save Product</button>
                        <button type="button" class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </template>

    <div id="app-confirm-modal" class="modal" hidden>
        <div class="form-container confirm-modal-content">
            <p id="app-confirm-message" class="mb-20"></p>
            <div class="modal-actions">
                <button type="button" id="app-confirm-ok" class="btn">Confirm</button>
                <button type="button" id="app-confirm-cancel" class="btn btn-outline">Cancel</button>
            </div>
        </div>
    </div>

</body>
